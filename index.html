<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parthiban Kumar — Data Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E1F;
  --bg2:#0E1428;
  --panel:#141B33;
  --panel2:#171F3B;
  --line:#26304F;
  --line2:#313D63;
  --mute:#8B96BC;
  --dim:#A9B3D6;
  --paper:#EEF1FB;
  --gold:#E9B454;
  --gold2:#F2C978;
  --iris:#7C83F5;
  --bronze:#C97C46;
  --silver:#A6B2D6;
  --live:#57E3A0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--paper);
  font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* ambient aurora glow */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(70% 55% at 18% -5%, rgba(124,131,245,.20), transparent 60%),
    radial-gradient(60% 50% at 92% 8%, rgba(233,180,84,.14), transparent 55%),
    radial-gradient(80% 60% at 60% 105%, rgba(87,227,160,.08), transparent 60%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(140,150,190,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(180deg,#000,transparent 70%);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
a{color:inherit}

/* bar */
.bar{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;background:rgba(10,14,31,.72);backdrop-filter:blur(14px) saturate(1.3)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;height:62px}
.mark{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.mark b{color:var(--paper);font-weight:600}
.nav{display:flex;gap:30px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav a{color:var(--mute);text-decoration:none;position:relative;transition:color .2s}
.nav a::after{content:'';position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--gold);transition:width .25s}
.nav a:hover,.nav a:focus-visible{color:var(--gold)}
.nav a:hover::after{width:100%}
@media(max-width:720px){.nav{display:none}}

/* hero */
.hero{padding:104px 0 84px;border-bottom:1px solid var(--line);position:relative}
.hero-grid{display:grid;grid-template-columns:1fr 300px;gap:52px;align-items:center}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr;gap:36px}}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:26px;height:1px;background:var(--gold);display:inline-block}
h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(44px,7vw,84px);line-height:1;font-weight:600;letter-spacing:-.02em;margin-bottom:26px}
h1 .grad{background:linear-gradient(120deg,var(--paper) 20%,var(--gold2) 55%,var(--iris) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{display:block;font-family:'IBM Plex Sans',sans-serif;color:var(--dim);font-weight:400;font-size:clamp(16px,2.2vw,21px);letter-spacing:0;margin-top:20px;max-width:34ch}
.lede{font-size:17px;color:var(--dim);max-width:56ch;margin:30px 0 34px}
.links{display:flex;gap:13px;flex-wrap:wrap}
.btn{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;padding:12px 21px;border:1px solid var(--line2);border-radius:8px;text-decoration:none;transition:all .2s;background:rgba(255,255,255,.015)}
.btn:hover,.btn:focus-visible{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.btn.solid{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241a08;border-color:transparent;font-weight:600}
.btn.solid:hover,.btn.solid:focus-visible{filter:brightness(1.08);color:#241a08}

/* photo */
.photo-wrap{position:relative;justify-self:center}
.photo{width:280px;height:320px;object-fit:cover;border-radius:20px;border:1px solid var(--line2);
  box-shadow:0 30px 80px -30px rgba(124,131,245,.5), 0 0 0 1px rgba(255,255,255,.02) inset;
  filter:saturate(1.05) contrast(1.02)}
.photo-wrap::before{content:'';position:absolute;inset:-14px;border-radius:26px;z-index:-1;
  background:linear-gradient(135deg,rgba(233,180,84,.5),rgba(124,131,245,.4));filter:blur(24px);opacity:.5}
.photo-ph{width:280px;height:320px;border-radius:20px;border:1px dashed var(--line2);
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;
  background:linear-gradient(160deg,var(--panel),var(--bg2));padding:20px}

/* sections */
section{padding:88px 0;border-bottom:1px solid var(--line);position:relative}
.sec-h{display:flex;align-items:baseline;gap:16px;margin-bottom:46px}
.sec-n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:.14em}
h2{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:-.01em}

/* projects */
.proj{border:1px solid var(--line);border-radius:16px;padding:34px;margin-bottom:22px;
  background:linear-gradient(165deg,var(--panel),var(--bg2));position:relative;overflow:hidden;
  transition:border-color .3s,transform .3s,box-shadow .3s}
.proj::before{content:'';position:absolute;left:0;top:0;height:100%;width:3px;
  background:linear-gradient(180deg,var(--gold),var(--iris));opacity:0;transition:opacity .3s}
.proj:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 24px 60px -34px rgba(124,131,245,.5)}
.proj:hover::before{opacity:1}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.proj h3{font-family:'Fraunces',serif;font-size:23px;font-weight:600;letter-spacing:-.01em}
.status{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--live);white-space:nowrap;padding:4px 11px;border:1px solid rgba(87,227,160,.3);border-radius:20px;background:rgba(87,227,160,.08)}
.status.wip{color:var(--mute);border-color:var(--line2);background:transparent}
.proj p{color:var(--dim);font-size:15.5px;margin-bottom:20px;max-width:74ch}
.stack{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 11px;border:1px solid var(--line2);color:var(--dim);border-radius:6px;background:rgba(255,255,255,.02);transition:all .2s}
.proj:hover .chip{border-color:var(--line2)}
.chip:hover{color:var(--gold);border-color:var(--gold)}
.proj-links{display:flex;gap:10px;flex-wrap:wrap}
.plink{font-family:'IBM Plex Mono',monospace;font-size:12px;text-decoration:none;color:var(--gold);
  padding:7px 14px;border:1px solid rgba(233,180,84,.3);border-radius:7px;transition:all .2s}
.plink:hover{background:rgba(233,180,84,.1);transform:translateY(-1px)}
.plink::after{content:' →'}

/* pipeline strip inside a project */
.pipe{margin-top:26px;padding-top:24px;border-top:1px dashed var(--line2);overflow-x:auto}
.pipe-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.pipe-inner{display:flex;align-items:stretch;gap:0;min-width:720px;position:relative}
.pnode{flex:1;padding:18px 16px;border:1px solid var(--line);border-right:none;position:relative;
  background:rgba(20,27,51,.6);opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.pnode:first-child{border-radius:10px 0 0 10px}
.pnode:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.reveal .pnode{opacity:1;transform:none}
.reveal .pnode:nth-child(1){transition-delay:.05s}
.reveal .pnode:nth-child(2){transition-delay:.15s}
.reveal .pnode:nth-child(3){transition-delay:.25s}
.reveal .pnode:nth-child(4){transition-delay:.35s}
.reveal .pnode:nth-child(5){transition-delay:.45s}
.pnode::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%) rotate(45deg);width:12px;height:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel);z-index:2}
.pnode:last-child::after{display:none}
.pnode-k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.pnode-n{font-weight:600;font-size:14px;margin-bottom:3px}
.pnode-d{font-size:11px;color:var(--mute);font-family:'IBM Plex Mono',monospace}
.pnode.b{border-top:2px solid var(--bronze)}
.pnode.s{border-top:2px solid var(--silver)}
.pnode.g{border-top:2px solid var(--gold)}
/* travelling dot */
.pipe-inner .spark{position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 12px 2px rgba(233,180,84,.7);opacity:0}
.reveal .pipe-inner .spark{animation:travel 3.4s ease-in-out .6s infinite}
@keyframes travel{0%{left:2%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:98%;opacity:0}}

/* stack */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cell{background:linear-gradient(165deg,var(--panel),var(--bg2));padding:24px;border:1px solid var(--line);border-radius:13px;transition:border-color .3s,transform .3s}
.cell:hover{border-color:var(--gold);transform:translateY(-3px)}
.cell h4{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:13px;font-weight:500}
.cell p{font-size:14px;color:var(--dim);line-height:1.8}

/* experience — timeline */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold),var(--iris),transparent)}
.job{position:relative;padding:0 0 34px 30px}
.job:last-child{padding-bottom:0}
.job::before{content:'';position:absolute;left:-30px;top:5px;width:16px;height:16px;border-radius:50%;
  background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(233,180,84,.12);transition:transform .3s,box-shadow .3s}
.job:hover::before{transform:scale(1.25);box-shadow:0 0 0 6px rgba(233,180,84,.18)}
.job-when{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:.04em;margin-bottom:6px}
.job h3{font-size:17px;font-weight:600;margin-bottom:4px}
.job-co{font-size:14px;color:var(--iris);margin-bottom:11px;font-weight:500}
.job p{font-size:14.5px;color:var(--dim);max-width:70ch}

/* footer */
footer{padding:64px 0 72px;text-align:center}
.foot-cta{font-family:'Fraunces',serif;font-size:26px;margin-bottom:26px;color:var(--paper)}
.foot-cta a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(233,180,84,.4);transition:border-color .2s}
.foot-cta a:hover{border-color:var(--gold)}
.fl{display:flex;gap:24px;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;flex-wrap:wrap;color:var(--mute)}
.fl a{color:var(--dim);text-decoration:none;transition:color .2s}
.fl a:hover{color:var(--gold)}
.foot-loc{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);margin-top:22px;letter-spacing:.04em}

/* scroll reveal */
.r{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.r.in{opacity:1;transform:none}
.r.d1{transition-delay:.08s}.r.d2{transition-delay:.16s}.r.d3{transition-delay:.24s}.r.d4{transition-delay:.32s}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.r,.pnode{opacity:1!important;transform:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <div class="mark"><b>PARTHIBAN</b> KUMAR</div>
    <nav class="nav">
      <a href="#work">Projects</a>
      <a href="#stack">Stack</a>
      <a href="#exp">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</div>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" id="hero-eyebrow"></div>
      <h1 id="hero-title"></h1>
      <p class="lede" id="hero-lede"></p>
      <div class="links" id="hero-links"></div>
    </div>
    <div class="photo-wrap" id="photo-slot"></div>
  </div>
</header>

<section id="work">
  <div class="wrap">
    <div class="sec-h r"><span class="sec-n">01</span><h2>Projects</h2></div>
    <div id="projects"></div>
  </div>
</section>

<section id="stack">
  <div class="wrap">
    <div class="sec-h r"><span class="sec-n">02</span><h2>Stack</h2></div>
    <div class="grid" id="stack-grid"></div>
  </div>
</section>

<section id="exp">
  <div class="wrap">
    <div class="sec-h r"><span class="sec-n">03</span><h2>Experience</h2></div>
    <div class="timeline" id="experience"></div>
  </div>
</section>

<footer id="contact">
  <div class="wrap">
    <p class="foot-cta r">Let's talk — <a id="cta-mail" href="#">get in touch</a></p>
    <div class="fl r d1" id="footer-links"></div>
    <div class="foot-loc r d2" id="footer-loc"></div>
  </div>
</footer>

<script src="projects.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// hero
document.getElementById('hero-eyebrow').textContent = PROFILE.location;
document.getElementById('hero-title').innerHTML = `<span class="grad">${esc(PROFILE.role)}</span><span class="sub">${esc(PROFILE.tagline)}</span>`;
document.getElementById('hero-lede').textContent = PROFILE.lede;
document.getElementById('hero-links').innerHTML = `
  <a class="btn solid" href="#work">See the work</a>
  <a class="btn" href="${esc(PROFILE.github)}">GitHub</a>
  <a class="btn" href="${esc(PROFILE.linkedin)}">LinkedIn</a>
  <a class="btn" href="${esc(PROFILE.resume)}">Résumé</a>`;

// photo (graceful fallback if the file is missing)
const slot = document.getElementById('photo-slot');
if (PROFILE.photo) {
  const img = new Image();
  img.className = 'photo'; img.alt = PROFILE.name; img.src = PROFILE.photo;
  img.onerror = () => { slot.innerHTML = '<div class="photo-ph">add photo.jpg<br>to your repo<br>to show it here</div>'; };
  slot.appendChild(img);
} else {
  slot.innerHTML = '<div class="photo-ph">add a photo</div>';
}

// projects (+ optional pipeline strip)
document.getElementById('projects').innerHTML = PROJECTS.map(p => {
  const pipe = (p.pipeline && p.pipeline.length) ? `
    <div class="pipe reveal-target">
      <div class="pipe-label">Pipeline</div>
      <div class="pipe-inner">
        <span class="spark"></span>
        ${p.pipeline.map(n => `
          <div class="pnode ${n.tone||''}">
            <div class="pnode-k">${esc(n.kind)}</div>
            <div class="pnode-n">${esc(n.name)}</div>
            <div class="pnode-d">${esc(n.note)}</div>
          </div>`).join('')}
      </div>
    </div>` : '';
  return `
  <article class="proj r">
    <div class="proj-top">
      <h3>${esc(p.title)}</h3>
      <span class="status ${p.status==='wip'?'wip':''}">${p.status==='wip'?'In progress':'Live'}</span>
    </div>
    <p>${esc(p.blurb)}</p>
    <div class="stack">${p.stack.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
    <div class="proj-links">${p.links.map(l=>`<a class="plink" href="${esc(l.url)}">${esc(l.label)}</a>`).join('')}</div>
    ${pipe}
  </article>`;
}).join('');

// stack
document.getElementById('stack-grid').innerHTML = STACK.map((s,i)=>`
  <div class="cell r d${(i%4)+1}"><h4>${esc(s.group)}</h4><p>${esc(s.items)}</p></div>`).join('');

// experience
document.getElementById('experience').innerHTML = EXPERIENCE.map(e=>`
  <div class="job r">
    <div class="job-when">${esc(e.when)}</div>
    <h3>${esc(e.role)}</h3>
    <div class="job-co">${esc(e.company)}</div>
    <p>${esc(e.blurb)}</p>
  </div>`).join('');

// footer
document.getElementById('cta-mail').href = `mailto:${esc(PROFILE.email)}`;
document.getElementById('footer-links').innerHTML = `
  <a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>
  <a href="${esc(PROFILE.linkedin)}">LinkedIn</a>
  <a href="${esc(PROFILE.github)}">GitHub</a>`;
document.getElementById('footer-loc').textContent = PROFILE.location;

// scroll reveal via IntersectionObserver
const io = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      en.target.classList.add('in');
      if(en.target.classList.contains('reveal-target')) en.target.classList.add('reveal');
      io.unobserve(en.target);
    }
  });
},{threshold:.15, rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.r, .reveal-target').forEach(el=>io.observe(el));
</script>
</body>
</html>
